name: ${COMPOSE_PROJECT_NAME:-nordic-regulated-ai}

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.dev.Dockerfile
    image: nordic-regulated-ai-web-local:phase7
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/nb/login').then((response) => process.exit(response.ok ? 0 :
          1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.dev.Dockerfile
    image: nordic-regulated-ai-api-local:phase2
    environment: &health_environment
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-nordic_local}
      POSTGRES_USER: ${POSTGRES_USER:-nordic_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password-not-for-production}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      AZURITE_BLOB_HEALTH_URL: http://${AZURITE_HOST:-azurite}:${AZURITE_BLOB_PORT:-10000}/${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
      NORDIC_API_DOCUMENT_UPLOAD_MAX_BYTES: ${NORDIC_API_DOCUMENT_UPLOAD_MAX_BYTES:-26214400}
      NORDIC_API_OBJECT_STORAGE_CONTAINER: ${AZURITE_CONTAINER:-nordic-local}
      NORDIC_API_OBJECT_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=${AZURITE_ACCOUNT_NAME:-devstoreaccount1};AccountKey=${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==};BlobEndpoint=http://${AZURITE_HOST:-azurite}:${AZURITE_BLOB_PORT:-10000}/${AZURITE_ACCOUNT_NAME:-devstoreaccount1};
      NORDIC_API_EMBEDDING_PROVIDER: ${NORDIC_API_EMBEDDING_PROVIDER:-openai}
      NORDIC_API_EMBEDDING_API_KEY: ${NORDIC_API_EMBEDDING_API_KEY:-}
      NORDIC_API_EMBEDDING_AZURE_ENDPOINT: ${NORDIC_API_EMBEDDING_AZURE_ENDPOINT:-}
      NORDIC_API_EMBEDDING_AZURE_API_VERSION: ${NORDIC_API_EMBEDDING_AZURE_API_VERSION:-2024-02-01}
      NORDIC_API_EMBEDDING_MODEL: ${NORDIC_API_EMBEDDING_MODEL:-text-embedding-3-small}
      NORDIC_API_EMBEDDING_TOKENIZER_ENCODING: ${NORDIC_API_EMBEDDING_TOKENIZER_ENCODING:-cl100k_base}
      NORDIC_API_EMBEDDING_CONFIGURATION_VERSION: ${NORDIC_API_EMBEDDING_CONFIGURATION_VERSION:-v1}
      NORDIC_API_DOCUMENT_CHUNK_MAX_TOKENS: ${NORDIC_API_DOCUMENT_CHUNK_MAX_TOKENS:-512}
      NORDIC_API_DOCUMENT_CHUNK_OVERLAP_TOKENS: ${NORDIC_API_DOCUMENT_CHUNK_OVERLAP_TOKENS:-64}
      NORDIC_API_DOCUMENT_CHUNK_MAXIMUM_COUNT: ${NORDIC_API_DOCUMENT_CHUNK_MAXIMUM_COUNT:-10000}
      NORDIC_API_EMBEDDING_BATCH_SIZE: ${NORDIC_API_EMBEDDING_BATCH_SIZE:-32}
      NORDIC_API_EMBEDDING_TIMEOUT_SECONDS: ${NORDIC_API_EMBEDDING_TIMEOUT_SECONDS:-30}
      NORDIC_API_DOCUMENT_INDEXER_TASK_TIMEOUT_SECONDS: ${NORDIC_API_DOCUMENT_INDEXER_TASK_TIMEOUT_SECONDS:-300}
      NORDIC_API_DOCUMENT_INDEXER_TASK_MAX_RETRIES: ${NORDIC_API_DOCUMENT_INDEXER_TASK_MAX_RETRIES:-3}
      NORDIC_API_DOCUMENT_INDEXER_RECONCILIATION_INTERVAL_SECONDS: ${NORDIC_API_DOCUMENT_INDEXER_RECONCILIATION_INTERVAL_SECONDS:-60}
      NORDIC_API_DOCUMENT_INDEXER_PROCESSING_LEASE_SECONDS: ${NORDIC_API_DOCUMENT_INDEXER_PROCESSING_LEASE_SECONDS:-600}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',
          timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.dev.Dockerfile
    image: nordic-regulated-ai-worker-local:phase12
    command:
      [
        'celery',
        '--quiet',
        '-A',
        'app.workers.celery_app:celery_app',
        'worker',
        '-Q',
        'document-parser,document-indexer,agent-orchestrator,evaluation',
        '--beat',
        '--loglevel=WARNING',
      ]
    environment: *health_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A app.workers.celery_app:celery_app inspect ping -d "celery@$$HOSTNAME" --timeout
          2 | grep -q pong',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nordic_local}
      POSTGRES_USER: ${POSTGRES_USER:-nordic_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password-not-for-production}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      [
        'azurite-blob',
        '--blobHost',
        '0.0.0.0',
        '--blobPort',
        '10000',
        '-l',
        '/data',
        '--skipApiVersionCheck',
      ]
    ports:
      - '127.0.0.1:${AZURITE_BLOB_HOST_PORT:-10000}:10000'
    volumes:
      - azurite_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const
          s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  azurite-init:
    image: mcr.microsoft.com/azure-cli:2.87.0
    environment:
      AZURITE_ACCOUNT_NAME: ${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
      AZURITE_ACCOUNT_KEY: '${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}'
      AZURITE_BLOB_ENDPOINT: http://${AZURITE_HOST:-azurite}:${AZURITE_BLOB_PORT:-10000}/${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
      AZURITE_CONTAINER: ${AZURITE_CONTAINER:-nordic-local}
    depends_on:
      azurite:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        az storage container create --name "$${AZURITE_CONTAINER}" --connection-string
        "DefaultEndpointsProtocol=http;AccountName=$${AZURITE_ACCOUNT_NAME};AccountKey=$${AZURITE_ACCOUNT_KEY};BlobEndpoint=$${AZURITE_BLOB_ENDPOINT};"
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  azurite_data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-nordic-regulated-ai}_default
    driver: bridge
