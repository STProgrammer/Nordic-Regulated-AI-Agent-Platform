name: ${COMPOSE_PROJECT_NAME:-nordic-regulated-ai-release}

x-app-environment: &app_environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-nordic_release_local}
  POSTGRES_USER: ${POSTGRES_USER:-nordic_release_local}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-release-postgres-password-not-for-production}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  NORDIC_API_ENVIRONMENT: ${NORDIC_API_ENVIRONMENT:-local}
  NORDIC_API_LOG_FORMAT: ${NORDIC_API_LOG_FORMAT:-json}
  NORDIC_API_ENABLE_DOCS: ${NORDIC_API_ENABLE_DOCS:-true}
  NORDIC_API_METRICS_ENABLED: ${NORDIC_API_METRICS_ENABLED:-false}
  NORDIC_API_CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:${RELEASE_WEB_HOST_PORT:-3100}"]'
  NORDIC_API_CSRF_TRUSTED_ORIGINS: '["http://127.0.0.1:${RELEASE_WEB_HOST_PORT:-3100}"]'
  NORDIC_API_OBJECT_STORAGE_CONTAINER: ${AZURITE_CONTAINER:-nordic-release-local}
  NORDIC_API_OBJECT_STORAGE_CONNECTION_STRING: >-
    DefaultEndpointsProtocol=http;AccountName=${AZURITE_ACCOUNT_NAME:-devstoreaccount1};AccountKey=${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==};BlobEndpoint=http://azurite:10000/${AZURITE_ACCOUNT_NAME:-devstoreaccount1};
  NORDIC_API_OBJECT_STORAGE_HEALTH_URL: http://azurite:10000/${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
  NORDIC_API_EMBEDDING_PROVIDER: ${NORDIC_API_EMBEDDING_PROVIDER:-deterministic}
  NORDIC_AGENT_ENVIRONMENT: ${NORDIC_AGENT_ENVIRONMENT:-local}
  NORDIC_AGENT_PROVIDER: ${NORDIC_AGENT_PROVIDER:-deterministic}

x-container-hardening: &container_hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: ${IMAGE_NAMESPACE:-nordic-regulated-ai}/web:${IMAGE_TAG:-local}
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://api:8000}
    ports:
      - '127.0.0.1:${RELEASE_WEB_HOST_PORT:-3100}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/nb/login').then((response) => process.exit(response.ok ? 0 :
          1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    <<: *container_hardening

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: ${IMAGE_NAMESPACE:-nordic-regulated-ai}/api:${IMAGE_TAG:-local}
    environment:
      <<: *app_environment
      NORDIC_API_SERVICE_NAME: nordic-regulated-ai-api
    ports:
      - '127.0.0.1:${RELEASE_API_HOST_PORT:-8100}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',
          timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    <<: *container_hardening

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    image: ${IMAGE_NAMESPACE:-nordic-regulated-ai}/worker:${IMAGE_TAG:-local}
    environment:
      <<: *app_environment
      NORDIC_API_SERVICE_NAME: nordic-regulated-ai-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'celery -A app.workers.celery_app:celery_app inspect ping -d "celery@$$HOSTNAME" --timeout
          2 | grep -q pong',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    <<: *container_hardening

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nordic_release_local}
      POSTGRES_USER: ${POSTGRES_USER:-nordic_release_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-release-postgres-password-not-for-production}
    volumes:
      - release_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - release_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      [
        'azurite-blob',
        '--blobHost',
        '0.0.0.0',
        '--blobPort',
        '10000',
        '-l',
        '/data',
        '--skipApiVersionCheck',
      ]
    volumes:
      - release_azurite_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const
          s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  azurite-init:
    image: mcr.microsoft.com/azure-cli:2.87.0
    environment:
      AZURITE_ACCOUNT_NAME: ${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
      AZURITE_ACCOUNT_KEY: '${AZURITE_ACCOUNT_KEY:-Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}'
      AZURITE_BLOB_ENDPOINT: http://azurite:10000/${AZURITE_ACCOUNT_NAME:-devstoreaccount1}
      AZURITE_CONTAINER: ${AZURITE_CONTAINER:-nordic-release-local}
    depends_on:
      azurite:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        az storage container create --name "$${AZURITE_CONTAINER}" --connection-string
        "DefaultEndpointsProtocol=http;AccountName=$${AZURITE_ACCOUNT_NAME};AccountKey=$${AZURITE_ACCOUNT_KEY};BlobEndpoint=$${AZURITE_BLOB_ENDPOINT};"
    restart: 'no'

volumes:
  release_postgres_data:
  release_redis_data:
  release_azurite_data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-nordic-regulated-ai-release}_default
    driver: bridge
