[project]
name = "nordic-regulated-ai-agent-platform-api"
version = "0.0.0"
description = "Backend API foundation for the Nordic Regulated AI Agent Platform."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx2>=2.4,<3",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0.40,<3",
  "structlog>=24.4,<26",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
