[project]
name = "nordic-regulated-ai-agent-platform-api"
version = "0.0.0"
description = "Phase 3 backend API skeleton for the Nordic Regulated AI Agent Platform."
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx2>=2.4,<3",
  "pydantic-settings>=2.5,<3",
  "redis>=5.2,<6",
  "structlog>=24.4,<26",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
