[project]
name = "nordic-regulated-ai-agent-platform-api"
version = "0.0.0"
description = "Backend API foundation for the Nordic Regulated AI Agent Platform."
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "aiohttp>=3.10,<4",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "azure-storage-blob>=12.25,<13",
  "celery>=5.5,<6",
  "fastapi>=0.115,<1",
  "httpx2>=2.4,<3",
  "langdetect>=1.0.9,<2",
  "openpyxl>=3.1,<4",
  "openai>=1.0,<2",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0.40,<3",
  "structlog>=24.4,<26",
  "tiktoken>=0.8,<1",
  "uvicorn>=0.34,<1",
  "nordic-regulated-ai-agent-platform-agent-orchestrator",
  "nordic-regulated-ai-agent-platform-evaluation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv.sources]
nordic-regulated-ai-agent-platform-agent-orchestrator = { workspace = true }
nordic-regulated-ai-agent-platform-evaluation = { workspace = true }
