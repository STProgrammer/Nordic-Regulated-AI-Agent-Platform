# Runtime source is scanned; pytest assertions and deliberate evaluation labels
# are not production security findings. B105/B106 identify the `pass_fail`
# domain field as a password, so they are excluded with this reviewed policy.
exclude_dirs:
  - apps/api/tests
  - apps/web/src/tests
  - packages/shared_schemas/tests
  - services/agent_orchestrator/tests
  - services/document_processor/tests
  - services/evaluation/tests
  - services/retrieval/tests
skips:
  - B105
  - B106
