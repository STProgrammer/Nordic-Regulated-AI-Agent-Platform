[project]
name = "nordic-regulated-ai-agent-platform-agent-orchestrator"
version = "0.0.0"
description = "Reserved workspace for future LangGraph workflows."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3.9,<2",
    "langchain-openai>=1.1.14,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint-postgres>=2,<4",
    "langmem>=0.0.30,<0.1",
    "openai>=2.26,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]
