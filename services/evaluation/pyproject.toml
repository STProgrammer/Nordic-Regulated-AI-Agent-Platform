[project]
name = "nordic-regulated-ai-agent-platform-evaluation"
version = "0.0.0"
description = "Deterministic, synthetic-only evaluation corpus and runner."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.5,<3",
  "nordic-regulated-ai-agent-platform-agent-orchestrator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

[tool.uv.sources]
nordic-regulated-ai-agent-platform-agent-orchestrator = { workspace = true }
