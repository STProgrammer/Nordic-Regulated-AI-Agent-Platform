name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: uv run ruff format --check apps services packages scripts
      - run: uv run ruff check apps services packages scripts
      - run: uv run mypy apps services packages scripts

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: uv run pytest apps/api/tests/unit

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: uv run pytest apps/api/tests/integration

  api-contract:
    name: API contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: uv run pytest apps/api/tests/api

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: pnpm --filter @nordic-regulated-ai-agent-platform/web lint
      - run: pnpm --filter @nordic-regulated-ai-agent-platform/web typecheck

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: pnpm test:web

  ai-regression:
    name: AI deterministic regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: uv run pytest services/agent_orchestrator/tests services/evaluation/tests
      - run: uv run python scripts/run_evals.py --dataset nordic-regulated-core-v1 --check

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: pnpm security:check

  container-build:
    name: Container build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose --env-file .env.example build web api worker

  system-smoke:
    name: Migration, OpenAPI, and browser smoke
    runs-on: ubuntu-24.04
    env:
      NORDIC_API_EMBEDDING_PROVIDER: deterministic
      NORDIC_AGENT_ENVIRONMENT: test
      NORDIC_AGENT_PROVIDER: deterministic
      NORDIC_LOCAL_SEED_PASSWORD: ci-synthetic-password-not-a-secret # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.23'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.8.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: timeout 10m pnpm --filter @nordic-regulated-ai-agent-platform/web exec playwright install --with-deps chromium-headless-shell
      - run: docker compose --env-file .env.example config --quiet
      - run: pnpm dev:up
      - run: docker compose --env-file .env.example exec -T api alembic -c apps/api/alembic.ini upgrade head
      - run: docker compose --env-file .env.example exec -T api python scripts/check_migrations.py
      - run: |
          mkdir -p "$RUNNER_TEMP/openapi"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/openapi/openapi.json" \
            http://127.0.0.1:8000/openapi.json
          uv run python -m json.tool "$RUNNER_TEMP/openapi/openapi.json" >/dev/null
          test -s "$RUNNER_TEMP/openapi/openapi.json"
      - run: pnpm verify:local-stack
      - run: pnpm --filter @nordic-regulated-ai-agent-platform/web exec playwright test e2e/case-management.spec.ts
      - name: Upload OpenAPI schema
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: ${{ runner.temp }}/openapi/openapi.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop local stack
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans
